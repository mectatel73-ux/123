<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Волчий Гид">
<meta name="mobile-web-app-capable" content="yes">
<title>Волчий Гид — До 1 Мая</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%D0%92%D0%BE%D0%BB%D1%87%D0%B8%D0%B9%20%D0%93%D0%B8%D0%B4%22%2C%22short_name%22%3A%22%D0%92%D0%BE%D0%BB%D0%BA%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230d0d12%22%2C%22theme_color%22%3A%22%230d0d12%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22%D0%92%D0%BE%D0%BB%D0%BA.jpg%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fjpeg%22%7D%5D%7D">
<link rel="apple-touch-icon" href="Волк.jpg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    overscroll-behavior-y: contain;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
    background: #0d0d12;
    color: #e8e8f0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .app {
    width: 100%;
    max-width: 480px;
  }

  /* ВОЛК — реальное фото */
  .wolf {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid #2a2a3a;
    box-shadow: 0 0 40px rgba(120, 80, 255, 0.2);
    margin-bottom: 14px;
    background: #14141c;
    position: relative;
  }
  .wolf img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .wolf-caption {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b8a8ff;
    font-weight: 600;
    text-align: center;
  }

  /* ОБРАТНЫЙ ОТСЧЁТ */
  .countdown {
    background: linear-gradient(135deg, #1a1a2e, #16162a);
    border: 1px solid #2a2a45;
    border-radius: 18px;
    padding: 18px 12px;
    text-align: center;
    margin-bottom: 14px;
  }
  .countdown-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7a7a9a;
    margin-bottom: 12px;
  }
  .countdown-timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .time-block {
    background: #0f0f1a;
    border: 1px solid #2a2a45;
    border-radius: 12px;
    padding: 10px 4px;
  }
  .time-num {
    font-size: 24px;
    font-weight: 800;
    color: #c4b5ff;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .time-txt {
    font-size: 10px;
    color: #6a6a8a;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 6px;
  }
  .countdown-date {
    margin-top: 12px;
    font-size: 13px;
    color: #8a8aaa;
  }
  .countdown-date b { color: #c4b5ff; }

  /* ПАНЕЛЬ ДНЯ */
  .today-panel {
    background: #16162a;
    border: 1px solid #2a2a45;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .today-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 8px;
  }
  .today-title {
    font-size: 13px;
    color: #9a9ab8;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .today-date {
    font-size: 12px;
    color: #6a6a8a;
    text-align: right;
  }

  /* СТАТЫ С КНОПКАМИ */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .stat {
    background: #0f0f1a;
    border: 1px solid #2a2a45;
    border-radius: 12px;
    padding: 10px 3px 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .stat-letter {
    font-size: 17px;
    font-weight: 800;
    color: #c4b5ff;
    line-height: 1;
  }
  .stat-val {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stat-max { font-size: 9px; color: #5a5a7a; }
  .stat-dot {
    width: 100%;
    height: 4px;
    background: #1f1f35;
    border-radius: 2px;
    overflow: hidden;
  }
  .stat-dot-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c5cff, #c4b5ff);
    width: 0%;
    transition: width 0.4s;
  }
  .stat-btn {
    width: 100%;
    margin-top: 4px;
    padding: 10px 0;
    min-height: 40px;
    background: linear-gradient(135deg, #6d4aff, #9a7cff);
    border: none;
    border-radius: 9px;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.1s, filter 0.15s;
    line-height: 1;
    touch-action: manipulation;
  }
  .stat-btn:active:not(:disabled) {
    transform: scale(0.93);
    filter: brightness(1.2);
  }
  .stat-btn:disabled {
    background: #2a2a3f;
    color: #5a5a7a;
    cursor: not-allowed;
  }

  /* ОЦЕНКА И ЦИТАТА */
  .row-block { margin-top: 16px; }
  .row-label {
    font-size: 12px;
    letter-spacing: 1px;
    color: #9a9ab8;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .rating {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .star {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f1a;
    border: 1px solid #2a2a45;
    border-radius: 12px;
    font-size: 26px;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s, border-color 0.2s;
    touch-action: manipulation;
  }
  .star:active { transform: scale(0.9); }
  .star.active {
    background: linear-gradient(135deg, #6d4aff, #9a7cff);
    border-color: #9a7cff;
    box-shadow: 0 0 20px rgba(124, 92, 255, 0.5);
  }
  .quote-input {
    width: 100%;
    background: #0f0f1a;
    border: 1px solid #2a2a45;
    border-radius: 12px;
    padding: 14px;
    color: #e8e8f0;
    font-size: 16px; /* 16px — чтоб iOS не зумил при фокусе */
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    -webkit-user-select: text;
    user-select: text;
  }
  .quote-input:focus {
    outline: none;
    border-color: #7c5cff;
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.15);
  }
  .quote-input::placeholder { color: #4a4a6a; }

  /* ИСТОРИЯ */
  .history { margin-top: 16px; }
  .history-title {
    font-size: 13px;
    color: #9a9ab8;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .day-card {
    background: #16162a;
    border: 1px solid #2a2a45;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .day-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .day-card-date {
    font-size: 13px;
    color: #c4b5ff;
    font-weight: 600;
  }
  .day-card-rate { font-size: 13px; }
  .day-card-stats {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .mini-stat {
    font-size: 11px;
    background: #0f0f1a;
    border-radius: 6px;
    padding: 3px 7px;
    color: #9a9ab8;
  }
  .mini-stat b { color: #c4b5ff; }
  .day-card-quote {
    font-size: 12px;
    color: #8a8aaa;
    font-style: italic;
    border-left: 2px solid #7c5cff;
    padding-left: 8px;
    -webkit-user-select: text;
    user-select: text;
  }
  .empty {
    text-align: center;
    color: #5a5a7a;
    font-size: 13px;
    padding: 20px;
  }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #6d4aff;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    transition: 0.3s;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(109, 74, 255, 0.5);
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* маленькие экраны */
  @media (max-width: 360px) {
    .stat-letter { font-size: 15px; }
    .stat-val { font-size: 13px; }
    .time-num { font-size: 20px; }
    .star { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ЭБАЛО ВОЛКА (фото) -->
  <div class="wolf">
    <img src="Волк.jpg" alt="Волк">
    <div class="wolf-caption">🐺 Волчий Гид</div>
  </div>

  <!-- ОБРАТНЫЙ ОТСЧЁТ -->
  <div class="countdown">
    <div class="countdown-label">До 1 мая осталось</div>
    <div class="countdown-timer" id="timer">
      <div class="time-block"><div class="time-num" id="cd-d">0</div><div class="time-txt">дней</div></div>
      <div class="time-block"><div class="time-num" id="cd-h">0</div><div class="time-txt">часов</div></div>
      <div class="time-block"><div class="time-num" id="cd-m">0</div><div class="time-txt">минут</div></div>
      <div class="time-block"><div class="time-num" id="cd-s">0</div><div class="time-txt">секунд</div></div>
    </div>
    <div class="countdown-date">Цель: <b>1 мая</b></div>
  </div>

  <!-- ПАНЕЛЬ СЕГОДНЯШНЕГО ДНЯ -->
  <div class="today-panel">
    <div class="today-header">
      <div class="today-title">Сегодня</div>
      <div class="today-date" id="todayDate"></div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <!-- ОЦЕНКА ДНЯ -->
    <div class="row-block">
      <div class="row-label">Оценка дня</div>
      <div class="rating" id="rating">
        <div class="star" data-v="1">😞</div>
        <div class="star" data-v="2">😕</div>
        <div class="star" data-v="3">😐</div>
        <div class="star" data-v="4">🙂</div>
        <div class="star" data-v="5">🤩</div>
      </div>
    </div>

    <!-- ЦИТАТА ДНЯ -->
    <div class="row-block">
      <div class="row-label">Цитата дня</div>
      <textarea class="quote-input" id="quoteInput" placeholder="Запиши мысль дня..."></textarea>
    </div>
  </div>

  <!-- ИСТОРИЯ -->
  <div class="history">
    <div class="history-title">История дней</div>
    <div id="historyList"><div class="empty">Пока пусто. Начни свой путь 🐺</div></div>
  </div>

</div>

<div class="toast" id="toast">Сохранено</div>

<script>
const KEYS = ['К', 'Н', 'П', 'Д', 'Ч'];
const STORAGE = 'wolfGuide_v1';

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    stats: { К: 0, Н: 0, П: 0, Д: 0, Ч: 0 },
    days: {},
  };
}

// миграция старого формата ("added: true/false" -> "added: {К:true,...}")
Object.values(state.days || {}).forEach(rec => {
  if (rec.added === true) {
    rec.added = { К:true, Н:true, П:true, Д:true, Ч:true };
  } else if (rec.added === false || !rec.added) {
    rec.added = {};
  }
});

function saveState() {
  localStorage.setItem(STORAGE, JSON.stringify(state));
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function todayRu() {
  const d = new Date();
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

function haptic(ms = 15) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

/* ===== ОБРАТНЫЙ ОТСЧЁТ ===== */
function updateCountdown() {
  const now = new Date();
  let year = now.getFullYear();
  let target = new Date(year, 4, 1);
  if (now > target) target = new Date(year + 1, 4, 1);

  const diff = target - now;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById('cd-d').textContent = d;
  document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
}

/* ===== ПАНЕЛЬ ПОКАЗАТЕЛЕЙ ===== */
function renderStats() {
  const rec = getTodayRecord();
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = KEYS.map(k => {
    const v = state.stats[k];
    const added = !!rec.added[k];
    return `
      <div class="stat">
        <div class="stat-letter">${k}</div>
        <div class="stat-val">${v}<span class="stat-max">/100</span></div>
        <div class="stat-dot"><div class="stat-dot-fill" style="width:${v}%"></div></div>
        <button class="stat-btn" data-key="${k}" ${added ? 'disabled' : ''}>
          ${added ? '✓' : '+1'}
        </button>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.stat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.key;
      const rec = getTodayRecord();
      if (rec.added[k]) return;
      state.stats[k] = Math.min(100, state.stats[k] + 1);
      rec.added[k] = true;
      saveState();
      haptic(20);
      renderStats();
      renderHistory();
      showToast(`${k}: +1 🐺`);
    });
  });
}

/* ===== ДЕНЬ ===== */
function getTodayRecord() {
  const key = todayKey();
  if (!state.days[key]) {
    state.days[key] = { added: {}, rating: 0, quote: '' };
  }
  if (!state.days[key].added) state.days[key].added = {};
  return state.days[key];
}

function renderToday() {
  const rec = getTodayRecord();
  document.getElementById('todayDate').textContent = todayRu();

  document.querySelectorAll('#rating .star').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.v) === rec.rating);
  });

  const qi = document.getElementById('quoteInput');
  if (qi.value !== rec.quote) qi.value = rec.quote;
}

/* ===== ОЦЕНКА ===== */
document.getElementById('rating').addEventListener('click', (e) => {
  const star = e.target.closest('.star');
  if (!star) return;
  const rec = getTodayRecord();
  const v = Number(star.dataset.v);
  rec.rating = rec.rating === v ? 0 : v;
  saveState();
  haptic(15);
  renderToday();
  renderHistory();
});

/* ===== ЦИТАТА ===== */
const quoteInput = document.getElementById('quoteInput');
let quoteTimer;
quoteInput.addEventListener('input', () => {
  clearTimeout(quoteTimer);
  quoteTimer = setTimeout(() => {
    const rec = getTodayRecord();
    rec.quote = quoteInput.value;
    saveState();
    renderHistory();
  }, 400);
});

/* ===== ИСТОРИЯ ===== */
function renderHistory() {
  const list = document.getElementById('historyList');
  const entries = Object.entries(state.days)
    .filter(([_, r]) => {
      const anyAdded = r.added && Object.values(r.added).some(Boolean);
      return anyAdded || r.rating || (r.quote && r.quote.trim());
    })
    .sort((a,b) => b[0].localeCompare(a[0]));

  if (!entries.length) {
    list.innerHTML = '<div class="empty">Пока пусто. Начни свой путь 🐺</div>';
    return;
  }

  list.innerHTML = entries.map(([date, r]) => {
    const [y,m,d] = date.split('-');
    const nice = `${d}.${m}.${y}`;
    const stars = r.rating ? '⭐'.repeat(r.rating) : '—';

    const stats = KEYS.map(k => {
      const add = r.added && r.added[k] ? '1' : '0';
      return `<span class="mini-stat">${k}:<b>+${add}</b></span>`;
    }).join('');

    const quote = r.quote && r.quote.trim()
      ? `<div class="day-card-quote">«${escapeHtml(r.quote.trim())}»</div>`
      : '';
    return `
      <div class="day-card">
        <div class="day-card-head">
          <div class="day-card-date">${nice}</div>
          <div class="day-card-rate">${stars}</div>
        </div>
        <div class="day-card-stats">${stats}</div>
        ${quote}
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== ТОСТ ===== */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

/* ===== ЗАПРЕТ ДВОЙНОГО ТАПА (ЗУМ) ===== */
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

/* ===== ИНИТ ===== */
updateCountdown();
setInterval(updateCountdown, 1000);
renderStats();
renderToday();
renderHistory();
</script>
</body>
</html>
