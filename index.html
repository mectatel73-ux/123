  .countdown-timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .time-block {
    background: #0f0f1a;
    border: 1px solid #2a2a45;
    border-radius: 12px;
    padding: 10px 4px;
  }
  .time-num {
    font-size: 24px; font-weight: 800;

    color: #fff; font-size: 15px; font-weight: 800;

    transition: transform 0.1s, filter 0.15s;
    line-height: 1;
    touch-action: manipulation;

  .stat-btn:active:not(:disabled) { transform: scale(0.93); filter: brightness(1.2); }

  .star {

    background: #0f0f1a;
    border: 1px solid #2a2a45;
    border-radius: 12px;
    font-size: 26px; cursor: pointer;

  .star:active { transform: scale(0.9); }
  .star.active {
    background: linear-gradient(135deg, #6d4aff, #9a7cff);

    font-family: inherit;

    outline: none; border-color: #7c5cff;

  .quote-input::placeholder { color: #4a4a6a; }

  /* ИСТОРИЯ */
  .history { margin-top: 16px; }
  .history-title {
    font-size: 13px; color: #9a9ab8;
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .day-card {
    background: #16162a;
    border: 1px solid #2a2a45;
    border-radius: 14px;
    padding: 12px; margin-bottom: 8px;
  }
  .day-card-head {
    display: flex; justify-content: space-between; align-items: center;

  }
  .day-card-date { font-size: 13px; color: #c4b5ff; font-weight: 600; }

  .day-card-stats { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
  .mini-stat {

  .mini-stat b { color: #c4b5ff; }
  .day-card-quote {
    font-size: 12px; color: #8a8aaa;
    font-style: italic;
    border-left: 2px solid #7c5cff;
    padding-left: 8px;
    -webkit-user-select: text;
    user-select: text;

  .empty { text-align: center; color: #5a5a7a; font-size: 13px; padding: 20px; }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));

  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 360px) {

    .star { font-size: 22px; }
    .app-header h1 { font-size: 14px; letter-spacing: 1px; }
    .app-icon { width: 38px; height: 38px; }

<script>
const KEYS = ['К', 'Н', 'П', 'Д', 'Ч'];
const STORAGE = 'wolfGuide_v1';

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    stats: { К: 0, Н: 0, П: 0, Д: 0, Ч: 0 },
    days: {},
  };
}

Object.values(state.days || {}).forEach(rec => {
  if (rec.added === true) rec.added = { К:true, Н:true, П:true, Д:true, Ч:true };
  else if (rec.added === false || !rec.added) rec.added = {};
});

function saveState() { localStorage.setItem(STORAGE, JSON.stringify(state)); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayRu() {
  const d = new Date();
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}
function haptic(ms = 15) { if (navigator.vibrate) navigator.vibrate(ms); }

function updateCountdown() {
  const now = new Date();
  let year = now.getFullYear();
  let target = new Date(year, 4, 1);
  if (now > target) target = new Date(year + 1, 4, 1);
  const diff = target - now;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('cd-d').textContent = d;
  document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
}

function renderStats() {
  const rec = getTodayRecord();
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = KEYS.map(k => {
    const v = state.stats[k];
    const added = !!rec.added[k];
    return `
      <div class="stat">
        <div class="stat-letter">${k}</div>
        <div class="stat-val">${v}<span class="stat-max">/100</span></div>
        <div class="stat-dot"><div class="stat-dot-fill" style="width:${v}%"></div></div>
        <button class="stat-btn" data-key="${k}" ${added ? 'disabled' : ''}>
          ${added ? '✓' : '+1'}
        </button>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.stat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.key;
      const rec = getTodayRecord();
      if (rec.added[k]) return;
      state.stats[k] = Math.min(100, state.stats[k] + 1);
      rec.added[k] = true;
      saveState(); haptic(20);
      renderStats(); renderHistory();
      showToast(`${k}: +1 🐺`);
    });
  });
}

function getTodayRecord() {
  const key = todayKey();
  if (!state.days[key]) state.days[key] = { added: {}, rating: 0, quote: '' };
  if (!state.days[key].added) state.days[key].added = {};
  return state.days[key];
}

function renderToday() {
  const rec = getTodayRecord();
  document.getElementById('todayDate').textContent = todayRu();
  document.querySelectorAll('#rating .star').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.v) === rec.rating);
  });
  const qi = document.getElementById('quoteInput');
  if (qi.value !== rec.quote) qi.value = rec.quote;
}

document.getElementById('rating').addEventListener('click', (e) => {
  const star = e.target.closest('.star');
  if (!star) return;
  const rec = getTodayRecord();
  const v = Number(star.dataset.v);
  rec.rating = rec.rating === v ? 0 : v;
  saveState(); haptic(15);
  renderToday(); renderHistory();
});

const quoteInput = document.getElementById('quoteInput');
let quoteTimer;
quoteInput.addEventListener('input', () => {
  clearTimeout(quoteTimer);
  quoteTimer = setTimeout(() => {
    const rec = getTodayRecord();
    rec.quote = quoteInput.value;
    saveState(); renderHistory();
  }, 400);
});

function renderHistory() {
  const list = document.getElementById('historyList');
  const entries = Object.entries(state.days)
    .filter(([_, r]) => {
      const anyAdded = r.added && Object.values(r.added).some(Boolean);
      return anyAdded || r.rating || (r.quote && r.quote.trim());
    })
    .sort((a,b) => b[0].localeCompare(a[0]));

  if (!entries.length) {
    list.innerHTML = '<div class="empty">Пока пусто. Начни свой путь 🐺</div>';
    return;
  }

  list.innerHTML = entries.map(([date, r]) => {
    const [y,m,d] = date.split('-');
    const nice = `${d}.${m}.${y}`;
    const stars = r.rating ? '⭐'.repeat(r.rating) : '—';
    const stats = KEYS.map(k => {
      const add = r.added && r.added[k] ? '1' : '0';
      return `<span class="mini-stat">${k}:<b>+${add}</b></span>`;
    }).join('');
    const quote = r.quote && r.quote.trim()
      ? `<div class="day-card-quote">«${escapeHtml(r.quote.trim())}»</div>` : '';
    return `
      <div class="day-card">
        <div class="day-card-head">
          <div class="day-card-date">${nice}</div>
          <div class="day-card-rate">${stars}</div>
        </div>
        <div class="day-card-stats">${stats}</div>
        ${quote}
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

updateCountdown();
setInterval(updateCountdown, 1000);
renderStats();
renderToday();
renderHistory();
</script>
</body>
</html>
